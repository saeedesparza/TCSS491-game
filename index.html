<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Failure Is Intended</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #gameWorld {
            background-image: url('./Assets/bg.png');
            background-size: 1024px 768px;
            background-position: top left;
            background-repeat: no-repeat;
        }
        #mainMenuOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #mainMenuOverlay h1 {
            color: #fff;
            font-size: 3em;
            margin-bottom: 2em;
            font-family: 'Micro 5', sans-serif;
            letter-spacing: 2px;
        }
        #mainMenuOverlay button {
            font-size: 2em;
            margin: 0.5em 0;
            padding: 0.5em 2em;
            border: none;
            border-radius: 8px;
            background: #222;
            color: #fff;
            cursor: pointer;
            font-family: 'Micro 5', sans-serif;
            transition: background 0.2s;
        }
        #mainMenuOverlay button:hover {
            background: #444;
        }
        #endGameOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1100;
        }
        #endGameOverlay h1 {
            color: #fff;
            font-size: 4em;
            margin: 0 0 0.5em 0;
            font-family: 'Micro 5', sans-serif;
            letter-spacing: 2px;
        }
        #endGameOverlay .end-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #endGameOverlay button {
            font-size: 2em;
            margin: 0.35em 0;
            padding: 0.45em 2em;
            border: none;
            border-radius: 8px;
            background: #222;
            color: #fff;
            cursor: pointer;
            font-family: 'Micro 5', sans-serif;
            transition: background 0.2s;
            min-width: 220px;
        }
        #endGameOverlay button:hover {
            background: #444;
        }
        #musicPlayer {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,20,0.92);
            border-radius: 12px;
            box-shadow: 0 2px 16px #0009;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            z-index: 2000;
            font-family: 'Micro 5', sans-serif;
        }
        #musicPlayer button {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.4em;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 6px;
            transition: background 0.15s;
            line-height: 1;
        }
        #musicPlayer button:hover {
            background: rgba(255,255,255,0.12);
        }
        #musicPlayer input[type=range] {
            width: 100px;
            accent-color: #fff;
            cursor: pointer;
        }
        #musicTrackLabel {
            color: #aaa;
            font-size: 0.85em;
            min-width: 80px;
            text-align: center;
            font-family: 'Micro 5', sans-serif;
        }
    </style>

</head>
<body>
    <div style="position: relative; width: 1024px; height: 768px; margin: auto;">
        <canvas id="gameWorld" width="1024" height="768" style="border: 1px solid black; display: block; position: absolute; left: 0; top: 0; z-index: 1;" tabindex="0" autofocus></canvas>
    </div>
    <div id="mainMenuOverlay">
        <h1>Failure Is Intended</h1>
        <label for="levelSelect" style="color:#fff;font-size:1.5em;margin-bottom:1em;">Select Level:</label>
        <select id="levelSelect" style="font-size:1.2em;margin-bottom:1em;">
            <option value="1">Level 1</option>
            <option value="2">Level 2</option>
            <option value="3">Level 3</option>
            <option value="4">Level 4</option>
            <option value="5">Level 5</option>
            <option value="6">Level 6</option>
            <option value="7">Level 7</option>
            <option value="8">Level 8</option>
            <option value="9">Level 9</option>
            <option value="10">Level 10</option>
        </select>
        <button id="startGameBtn">Start</button>
        <button id="quitGameBtn">Quit</button>
    </div>
    <div id="musicPlayer">
        <button id="musicPrev" title="Previous">&#9664;&#9664;</button>
        <button id="musicPause" title="Pause/Play">&#9646;&#9646;</button>
        <button id="musicNext" title="Next">&#9654;&#9654;</button>
        <span id="musicTrackLabel">Track 1 / 5</span>
        <span style="color:#aaa;font-size:0.85em;">&#9834;</span>
        <input type="range" id="musicVolume" min="0" max="100" value="50" title="Volume">
    </div>
    <div id="endGameOverlay">
        <div class="end-content">
            <h1>took you awhile</h1>
            <button id="restartGameBtn">Restart</button>
            <button id="endQuitGameBtn">Quit</button>
        </div>
    </div>

    <script>
    (function() {
        const tracks = [
            './Assets/Project_362.mp3',
            './Assets/Project_364.mp3',
            './Assets/Project_365.mp3',
            './Assets/Project_366.mp3',
            './Assets/Project_393.mp3'
        ];
        let currentTrack = 0;
        let started = false;
        const audio = new Audio();
        audio.volume = 0.5;

        function updateLabel() {
            const label = document.getElementById('musicTrackLabel');
            if (label) label.textContent = 'Track ' + (currentTrack + 1) + ' / ' + tracks.length;
        }

        function updatePauseBtn() {
            const btn = document.getElementById('musicPause');
            if (btn) btn.innerHTML = audio.paused ? '&#9654;' : '&#9646;&#9646;';
        }

        function playTrack(index) {
            currentTrack = ((index % tracks.length) + tracks.length) % tracks.length;
            audio.src = tracks[currentTrack];
            audio.play().catch(() => {});
            updateLabel();
            updatePauseBtn();
        }

        audio.addEventListener('ended', function() {
            playTrack(currentTrack + 1);
        });

        audio.addEventListener('pause', updatePauseBtn);
        audio.addEventListener('play', updatePauseBtn);

        // Browsers require a user gesture before playing audio
        function startMusic() {
            if (!started) {
                started = true;
                playTrack(0);
            }
            document.removeEventListener('click', startMusic);
            document.removeEventListener('keydown', startMusic);
        }

        document.addEventListener('click', startMusic);
        document.addEventListener('keydown', startMusic);

        document.addEventListener('DOMContentLoaded', function() {
            updateLabel();

            document.getElementById('musicPause').addEventListener('click', function(e) {
                e.stopPropagation();
                if (!started) { startMusic(); return; }
                if (audio.paused) audio.play().catch(() => {});
                else audio.pause();
            });

            document.getElementById('musicNext').addEventListener('click', function(e) {
                e.stopPropagation();
                if (!started) { startMusic(); return; }
                playTrack(currentTrack + 1);
            });

            document.getElementById('musicPrev').addEventListener('click', function(e) {
                e.stopPropagation();
                if (!started) { startMusic(); return; }
                // If more than 3s in, restart current track; otherwise go back
                if (audio.currentTime > 3) {
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                } else {
                    playTrack(currentTrack - 1);
                }
            });

            document.getElementById('musicVolume').addEventListener('input', function() {
                audio.volume = this.value / 100;
            });
        });
    })();

    window.addEventListener('DOMContentLoaded', function() {
        const menu = document.getElementById('mainMenuOverlay');
        const endOverlay = document.getElementById('endGameOverlay');
        const startBtn = document.getElementById('startGameBtn');
        const quitBtn = document.getElementById('quitGameBtn');
        const restartGameBtn = document.getElementById('restartGameBtn');
        const endQuitGameBtn = document.getElementById('endQuitGameBtn');
        const levelSelect = document.getElementById('levelSelect');

        window.showEndScreen = function() {
            if (endOverlay) {
                endOverlay.style.display = 'flex';
            }
        };

        if (menu && startBtn && levelSelect) {
            startBtn.addEventListener('click', function() {
                menu.style.display = 'none';
                if (endOverlay) {
                    endOverlay.style.display = 'none';
                }
                const canvas = document.getElementById('gameWorld');
                if (canvas) canvas.focus();
                // Set selected level and reload game
                window.selectedLevel = parseInt(levelSelect.value);
                if (window.sceneManager && window.selectedLevel) {
                    switch(window.selectedLevel) {
                        case 1: window.sceneManager.loadLevel1(); break;
                        case 2: window.sceneManager.loadLevel2(); break;
                        case 3: window.sceneManager.loadLevel3(); break;
                        case 4: window.sceneManager.loadLevel4(); break;
                        case 5: window.sceneManager.loadLevel5(); break;
                        case 6: window.sceneManager.loadLevel6(); break;
                        case 7: window.sceneManager.loadLevel7(); break;
                        case 8: window.sceneManager.loadLevel8(); break;
                        case 9: window.sceneManager.loadLevel9(); break;
                        case 10: window.sceneManager.loadLevel10(); break;
                        default: window.sceneManager.loadLevel1(); break;
                    }
                }
            });
        }
        if (quitBtn) {
            quitBtn.addEventListener('click', function() {
                window.close();
            });
        }

        if (restartGameBtn) {
            restartGameBtn.addEventListener('click', function() {
                if (endOverlay) {
                    endOverlay.style.display = 'none';
                }
                if (window.sceneManager && typeof window.sceneManager.restartGame === 'function') {
                    window.sceneManager.restartGame();
                } else if (window.sceneManager && typeof window.sceneManager.loadLevel1 === 'function') {
                    window.sceneManager.isGameComplete = false;
                    window.sceneManager.loadLevel1();
                }
                const canvas = document.getElementById('gameWorld');
                if (canvas) canvas.focus();
            });
        }

        if (endQuitGameBtn) {
            endQuitGameBtn.addEventListener('click', function() {
                window.close();
            });
        }
    });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Micro+5&display=swap" rel="stylesheet">
    <script type="text/javascript" src="./Scripts/assetmanager.js"></script>
    <script type="text/javascript" src="./Scripts/timer.js"></script>
    <script type="text/javascript" src="./Scripts/gameengine.js"></script>
    <script type="text/javascript" src="./Scripts/util.js"></script>
    <script type="text/javascript" src="./Scripts/animator.js"></script>
    <script type="text/javascript" src="./Scripts/platform.js"></script>
    <script type="text/javascript" src="./Scripts/verticalplatform.js"></script>
    <script type="text/javascript" src="./Scripts/fakeplatform.js"></script>
    <script type="text/javascript" src="./Scripts/movingplatform.js"></script>
    <script type="text/javascript" src="./Scripts/spikes.js"></script>
    <script type="text/javascript" src="./Scripts/spikesud.js"></script>
    <script type="text/javascript" src="./Scripts/spikeslr.js"></script>
    <script type="text/javascript" src="./Scripts/boundingbox.js"></script>
    <script type="text/javascript" src="./Scripts/border.js"></script>
    <script type="text/javascript" src="./Scripts/torch.js"></script>
    <script type="text/javascript" src="./Scripts/caveman.js"></script>
    <script type="text/javascript" src="./Scripts/scenemanager.js"></script>
    <script type="text/javascript" src="./Scripts/main.js"></script>
</body>
</html>
