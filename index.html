<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Failure Is Intended</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #gameWorld {
            background-image: url('./Assets/bg.png');
            background-size: 1024px 768px;
            background-position: top left;
            background-repeat: no-repeat;
        }
        #mainMenuOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #mainMenuOverlay h1 {
            color: #fff;
            font-size: 3em;
            margin-bottom: 2em;
            font-family: 'Micro 5', sans-serif;
            letter-spacing: 2px;
        }
        #mainMenuOverlay button {
            font-size: 2em;
            margin: 0.5em 0;
            padding: 0.5em 2em;
            border: none;
            border-radius: 8px;
            background: #222;
            color: #fff;
            cursor: pointer;
            font-family: 'Micro 5', sans-serif;
            transition: background 0.2s;
        }
        #mainMenuOverlay button:hover {
            background: #444;
        }
    </style>

</head>
<body>
    <div style="position: relative; width: 1024px; height: 768px; margin: auto;">
        <canvas id="gameWorld" width="1024" height="768" style="border: 1px solid black; display: block; position: absolute; left: 0; top: 0; z-index: 1;" tabindex="0" autofocus></canvas>
        <img id="hintArrowImg" src="Assets/arrowright.png" alt="Hint Arrow" style="position: absolute; top: 8px; right: 8px; width: 56px; height: 56px; z-index: 2; background: rgba(30,30,30,0.92); border-radius: 12px; box-shadow: 0 2px 12px #0008;" />
    </div>
    <div id="mainMenuOverlay">
        <h1>Failure Is Intended</h1>
        <label for="levelSelect" style="color:#fff;font-size:1.5em;margin-bottom:1em;">Select Level:</label>
        <select id="levelSelect" style="font-size:1.2em;margin-bottom:1em;">
            <option value="1">Level 1</option>
            <option value="2">Level 2</option>
            <option value="3">Level 3</option>
            <option value="4">Level 4</option>
            <option value="5">Level 5</option>
            <option value="6">Level 6</option>
            <option value="7">Level 7</option>
            <option value="8">Level 8</option>
            <option value="9">Level 9</option>
            <option value="10">Level 10</option>
        </select>
        <button id="startGameBtn">Start</button>
        <button id="quitGameBtn">Quit</button>
    </div>

    <script>
    window.addEventListener('DOMContentLoaded', function() {
        const menu = document.getElementById('mainMenuOverlay');
        const startBtn = document.getElementById('startGameBtn');
        const quitBtn = document.getElementById('quitGameBtn');
        const levelSelect = document.getElementById('levelSelect');
        if (menu && startBtn && levelSelect) {
            startBtn.addEventListener('click', function() {
                menu.style.display = 'none';
                const canvas = document.getElementById('gameWorld');
                if (canvas) canvas.focus();
                // Set selected level and reload game
                window.selectedLevel = parseInt(levelSelect.value);
                if (window.sceneManager && window.selectedLevel) {
                    switch(window.selectedLevel) {
                        case 1: window.sceneManager.loadLevel1(); break;
                        case 2: window.sceneManager.loadLevel2(); break;
                        case 3: window.sceneManager.loadLevel3(); break;
                        case 4: window.sceneManager.loadLevel4(); break;
                        case 5: window.sceneManager.loadLevel5(); break;
                        case 6: window.sceneManager.loadLevel6(); break;
                        case 7: window.sceneManager.loadLevel7(); break;
                        case 8: window.sceneManager.loadLevel8(); break;
                        case 9: window.sceneManager.loadLevel9(); break;
                        case 10: window.sceneManager.loadLevel10(); break;
                        default: window.sceneManager.loadLevel1(); break;
                    }
                }
            });
        }
        if (quitBtn) {
            quitBtn.addEventListener('click', function() {
                window.close();
            });
        }
    });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Micro+5&display=swap" rel="stylesheet">
    <script type="text/javascript" src="./Scripts/assetmanager.js"></script>
    <script type="text/javascript" src="./Scripts/timer.js"></script>
    <script type="text/javascript" src="./Scripts/gameengine.js"></script>
    <script type="text/javascript" src="./Scripts/util.js"></script>
    <script type="text/javascript" src="./Scripts/animator.js"></script>
    <script type="text/javascript" src="./Scripts/platform.js"></script>
    <script type="text/javascript" src="./Scripts/verticalplatform.js"></script>
    <script type="text/javascript" src="./Scripts/fakeplatform.js"></script>
    <script type="text/javascript" src="./Scripts/movingplatform.js"></script>
    <script type="text/javascript" src="./Scripts/spikes.js"></script>
    <script type="text/javascript" src="./Scripts/spikesud.js"></script>
    <script type="text/javascript" src="./Scripts/spikeslr.js"></script>
    <script type="text/javascript" src="./Scripts/boundingbox.js"></script>
    <script type="text/javascript" src="./Scripts/border.js"></script>
    <script type="text/javascript" src="./Scripts/torch.js"></script>
    <script type="text/javascript" src="./Scripts/caveman.js"></script>
    <script type="text/javascript" src="./Scripts/scenemanager.js"></script>
    <script type="text/javascript" src="./Scripts/main.js"></script>
</body>
</html>
